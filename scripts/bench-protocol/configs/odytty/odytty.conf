# Protocol 1.1.0 W6 plain profile. Geometry is verified at the PTY boundary.
theme = benchmark
font_family = DejaVu Sans Mono
font_size = 12
line_height = 1
visual = off
render_quality = plain
window_padding = 0
window_transparency = off
window_opacity = 100
background_treatment = off
