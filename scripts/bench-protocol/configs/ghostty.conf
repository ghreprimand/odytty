font-family = DejaVu Sans Mono
font-size = 12
font-feature = -liga
font-feature = -clig
font-feature = -calt
window-width = 80
window-height = 24
window-padding-x = 0
window-padding-y = 0
# window-width/window-height are terminal grid cells, not pixels. On Linux
# with GTK the computed window size does not account for window decorations,
# so the requested cell grid is not reached unless decorations are disabled.
# Ghostty's own documentation states the setting works as expected with
# decorations off, so the benchmark profile disables them. The production
# handshake still verifies the mapped viewport and normalizes it when the
# compositor overrides the initial cell request.
window-decoration = none
background = 101010
foreground = c0c0c0
background-opacity = 1
background-image =
cursor-style-blink = false
bell-features = no-system,no-audio,no-attention,no-title,no-border
# Ghostty's scrollback-limit is a BYTE budget, not a line count. Its own
# documentation states "the size of the scrollback buffer in bytes", and its
# default is 10000000. Every other profile in this catalogue expresses the
# same setting in lines: kitty `scrollback_lines 100000`, alacritty
# `history = 100000`, odytty `scrollback_lines = 100000`.
#
# This file previously carried `scrollback-limit = 100000`, copied across as
# though the unit matched. That is ~100 KB, which retains a negligible
# fraction of the history the other three retain, so the profile was not the
# matched configuration it claimed to be. A fill to the catalogue's depth was
# measured retaining essentially nothing under the old value.
#
# The value below is a byte budget deliberately far above what the catalogue's
# line depth needs, so that the shared 100,000-line depth is the binding
# constraint for every implementation rather than an implementation-specific
# byte cap. Ghostty allocates scrollback lazily up to the limit, so this does
# not itself consume memory.
#
# Correcting this changes the profile digest, and therefore the profile
# identity. Results measured under the previous value are not pooled with
# results measured under this one. The published W6 (idle) samples are not
# retroactively affected in substance - an idle terminal retains no scrollback
# - but they were taken under the previous profile identity and stay recorded
# that way.
scrollback-limit = 536870912
window-theme = ghostty
