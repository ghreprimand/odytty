# SPDX-License-Identifier: GPL-3.0-only
#
# Compatibility corpus manifest.
#
# One [[case]] entry per tracked case file under cases/. The entry carries the
# canonical metadata — provenance, origin, consent, license, evidence class,
# payload digest, and platform reach — while the case file carries the payload
# and the replay expectations. The validator (scripts/compatibility-corpus.py)
# enforces a strict one-to-one correspondence between the two: a file with no
# entry is unreviewed material in the tracked tree, and an entry with no file
# is a case that cannot run.
#
# The full contract is docs/compatibility/corpus.md. Rules a contributor most
# often trips over, in brief:
#
#   - sha256 is the digest of the ASSEMBLED payload bytes; recompute it with
#     the validator whenever the bytes change. Never edit bytes to match a
#     stale digest.
#   - The at-sign ban is blanket, in payloads and in every string below.
#   - Only minimized, reviewed, public-safe cases are tracked. Incoming
#     material lives untracked under .archon/compat-intake until accept.
#   - Evidence classes never blur: a vttest-derived case is not real-app
#     evidence, and a fuzz minimization is not a differential result.

[corpus]
schema_version = "1.0.0"

[policy]
# Reviewable caps; the validator's hard ceilings sit above these and cannot be
# lifted from this file. A case that wants more room is not minimized.
max_cases = 64
max_payload_bytes = 16384
max_columns = 200
max_rows = 100
max_chunks = 512
max_expectations_per_case = 32

# ---------------------------------------------------------------------------
# Example corpus
#
# Six synthetic authored cases, one per evidence class (parser carries two).
# They exist to exercise every class code path in the validator and the replay
# harness, and to show the shape a real intake case takes. Cases land one at a
# time, each tied to a fixed compatibility bug or a stated compatibility fact.
# ---------------------------------------------------------------------------

[[case]]
id = "differential.ed2-preserves-cursor"
title = "Erase-in-display clears cells without moving the cursor"
evidence_class = "differential"
fixture = "cases/differential.ed2-preserves-cursor.vtseq"
sha256 = "02aaa6d5cb7774f08c9b86b4446d1ac13dc164478e65608842e8ba0cf2787d24"
origin = "authored"
origin_ref = ""
license = "GPL-3.0-only"
consent = "author"
reviewed = true
minimized = true
platforms = ["linux", "macos", "windows"]
contains_windows_path_data = false
contains_utf16_data = false
reference = "ECMA-48 8.3.39 (ED — erase in display)"
notes = """
ED 2 clears every cell and leaves the cursor untouched; the shell `clear`
composite adds the cursor home as a separate CUP. The reference semantics, not
any one terminal's implementation, decide the expectation."""

