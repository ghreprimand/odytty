[[case]]
id = "parser.osc7-windows-drive-cwd"
title = "OSC 7 drive-letter working directory is stored as data"
evidence_class = "parser"
fixture = "cases/parser.osc7-windows-drive-cwd.vtseq"
sha256 = "d7c807cd33dd82f95e6526365dada1d9e5661cc9c87a5fe13404b8b08ee08df6"
origin = "authored"
origin_ref = ""
license = "GPL-3.0-only"
consent = "author"
reviewed = true
minimized = true
platforms = ["linux", "macos", "windows"]
contains_windows_path_data = true
contains_utf16_data = false
notes = """
The PowerShell shell integration reports drive-letter cwds in OSC 7 file
URLs. The core percent-decodes the path, validates the URL host, and stores
the string; it never touches a filesystem with it. The path here is a
synthetic placeholder, and the expectation holds identically on every
platform — nothing about Windows process behavior is inferred from it."""

