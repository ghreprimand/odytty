[package]
name = "odytty"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.102"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
crossterm = "0.29.0"
pollster = "0.4.0"
portable-pty = "0.9.0"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
vte = "0.15.0"
wgpu = "29.0.3"
winit = "0.30.13"

# Headless performance benchmarks (dependency-free custom harness). Run with
# `cargo bench --bench perf`; excluded from `cargo test`.
[[bench]]
name = "perf"
harness = false
