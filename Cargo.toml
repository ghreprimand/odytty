[package]
name = "odytty"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.102"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
libc = "0.2.178"
png = "0.18.1"
pollster = "0.4.0"
rustix = { version = "1.1.4", features = ["pty", "termios"] }
swash = "0.2.9"
thiserror = "2.0.18"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
wgpu = "29.0.3"
winit = "0.30.13"

# Headless performance benchmarks (dependency-free custom harness). Run with
# `cargo bench --bench perf`; excluded from `cargo test`.
[[bench]]
name = "perf"
harness = false
