[package]
name = "odytty"
version = "0.11.0"
edition = "2024"
# Minimum Supported Rust Version. Verified, not aspirational: the fuzz/test
# suites use a method-resolution/deref-coercion behavior that compiles on 1.96
# but not 1.95 (see the `rng.pick(...)` sites noted in rust-toolchain.toml), and
# rust-toolchain.toml pins the build to 1.96.0 — so CI already compiles AT this
# floor on every run. Keep this in lockstep with rust-toolchain.toml's channel:
# if that pin moves, this must move with it (and vice versa).
rust-version = "1.96"
license = "GPL-3.0-only"
description = "A from-scratch, GPU-rendered Rust terminal emulator with an Odyssey visual identity."
homepage = "https://odytty.unfinished-works.com"
repository = "https://github.com/ghreprimand/odytty"

[features]
# Default builds include the bundled symbols-only Nerd Font face so PUA prompt
# icons render out of the box without host Nerd Font installation.
default = ["bundled-symbols-font"]
bundled-symbols-font = []

# Lint policy lives in the manifest so it is reproducible from a bare
# `cargo clippy`, not only from the CI flag. This mirrors the existing CI gate
# (`cargo clippy --all-targets --locked -- -D warnings`): the whole default
# Clippy set is denied. It cannot introduce new failures — CI already proves the
# tree is Clippy-clean on every push. `priority = -1` lets any future per-lint
# `allow` override the group. (Pedantic is intentionally NOT enabled: under the
# `-D warnings` gate it would promote hundreds of style nits to hard errors.)
[lints.clippy]
all = { level = "deny", priority = -1 }

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1.0.102"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
bytemuck = { version = "1.25.0", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
png = "0.18.1"
pollster = "0.4.0"
# Direct use of the already-transitive Fontations stack evaluates guarded COLR
# v1 Paint graphs. `swash` remains the shaping and bitmap/COLR v0 rasterizer.
skrifa = "0.42.1"
swash = "0.2.9"
thiserror = "2.0.18"
tiny-skia = { version = "0.11.4", default-features = false, features = ["std", "simd"] }
# Read-only access to font name/metadata tables (real family name, OS/2 weight,
# italic + monospace flags) so font enumeration and family resolution use real
# metadata rather than guessing from filenames. Already in the tree transitively
# via ab_glyph (same parser); used here for table reads only, never rasterizing.
ttf-parser = "0.25.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-width = "0.2.2"
wgpu = "29.0.3"
winit = "0.30.13"

# POSIX-only dependencies. `libc` and `rustix` back the Unix PTY/termios layer
# (`src/pty/unix.rs`) and the POSIX shared-memory Kitty transport; both are
# gated `#[cfg(unix)]` in source, so they are pulled only on Unix targets and a
# Windows build never sees them. Keep entries here in lockstep with the
# `#[cfg(unix)]` gating that makes them reachable. The `pipe` feature is
# declared explicitly (not left to transitive feature unification) so the PTY
# reader-wake self-pipe compiles on macOS as well as Linux.
[target.'cfg(unix)'.dependencies]
libc = "0.2.178"
rustix = { version = "1.1.4", features = ["pipe", "pty", "termios", "process"] }

# Windows-only: the ConPTY PTY backend (`src/pty/windows.rs`). Pinned to the
# `windows` 0.62 stack `wgpu` already locks transitively (Cargo.lock has
# windows 0.62.2) so no second copy is pulled. `Win32_Security` is required even
# though it is not called directly: the `CreatePipe`/`CreateProcessW` bindings
# are cfg-gated on it in 0.62.2 (their `SECURITY_ATTRIBUTES` parameters). All
# usage is behind `#[cfg(windows)]`, so Unix builds never see this crate.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_System_Environment",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

# Windows-only build dependency: embeds the application icon (and version
# resource) into `odytty.exe` as a PE resource so Explorer/taskbar/Alt-Tab show
# it. `winresource` is the maintained successor to `winres`. It is a BUILD-dep
# gated to `cfg(windows)`, so it appears in Cargo.lock but is compiled only on a
# Windows build host and never enters the runtime graph. The actual embed in
# build.rs additionally requires `CARGO_CFG_TARGET_OS == "windows"`, so both the
# host and target must be Windows.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

# macOS-only: native "Open With…" app enumeration via NSWorkspace (Phase 17).
# Pinned to the exact objc2 stack winit 0.30.13 already locks so no third copy
# is pulled (objc2 0.5.2 / objc2-foundation 0.2.2 / objc2-app-kit 0.2.2). All
# FFI is behind cfg(target_os = "macos"); the pure mapper compiles everywhere.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-foundation = { version = "0.2.2", features = ["NSURL", "NSString", "NSArray"] }
objc2-app-kit = { version = "0.2.2", features = ["NSWorkspace"] }

# Headless performance benchmarks (dependency-free custom harness). Run with
# `cargo bench --bench perf`; excluded from `cargo test`.
[[bench]]
name = "perf"
harness = false

# Debian package metadata (cargo-deb). Produces a native .deb for the prebuilt
# Linux x86_64 release binary as a slim alternative to the portable AppImage.
# The release CI builds on ubuntu-22.04, so the glibc floor is 2.35; `$auto`
# expands (via dpkg-shlibdeps) to the exact ldd-linked runtime deps with their
# version floors (libc6, libgcc-s1, libm). The font/Vulkan/xkbcommon libraries
# are dlopen'd at runtime by winit/wgpu (they never appear in `ldd`), so they
# are declared explicitly here, mirroring the AUR runtime set mapped to Debian
# package names. libwayland-client0 is intentionally omitted: winit dlopens it
# only on a Wayland session and falls back to X11 otherwise, and it is not in
# the reference AUR depends.
[package.metadata.deb]
maintainer = "Unfinished Works <maintainers@odytty.unfinished-works.com>"
copyright = "2026 Unfinished Works and the OdyTTY contributors"
license-file = ["LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
GPU-rendered Rust terminal emulator with an Odyssey visual identity. Owns the \
terminal byte path from PTY allocation through escape parsing, terminal state, \
render geometry, and GPU presentation. The host must provide GPU drivers \
exposing either Vulkan (Mesa or a vendor ICD) or accelerated OpenGL/GLES."""
depends = "$auto, libfontconfig1, libfreetype6, libvulkan1, libxkbcommon0, hicolor-icon-theme"
assets = [
    ["target/release/odytty", "usr/bin/", "755"],
    ["dist/linux/io.unfinished_works.odytty.desktop", "usr/share/applications/", "644"],
    ["dist/linux/io.unfinished_works.odytty.metainfo.xml", "usr/share/metainfo/", "644"],
    ["dist/icons/hicolor/48x48/apps/io.unfinished_works.odytty.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["dist/icons/hicolor/64x64/apps/io.unfinished_works.odytty.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["dist/icons/hicolor/128x128/apps/io.unfinished_works.odytty.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["dist/icons/hicolor/256x256/apps/io.unfinished_works.odytty.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["dist/icons/hicolor/scalable/apps/io.unfinished_works.odytty.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/odytty/README.md", "644"],
    ["NOTICE", "usr/share/doc/odytty/NOTICE", "644"],
]

# RPM package metadata (cargo-generate-rpm). Best-effort like the AppImage: the
# .rpm is cross-built on the ubuntu-22.04 release runner and cannot be runtime
# tested on the base CI matrix, only metadata-validated (`rpm -qip`). auto-req
# is disabled because ELF auto-requires generated on Ubuntu are not a reliable
# cross-distro signal; the meaningful runtime deps are declared explicitly with
# Fedora package names (glibc/libgcc are present on every Fedora host). Same
# asset layout as the .deb.
[package.metadata.generate-rpm]
summary = "GPU-rendered Rust terminal emulator with an Odyssey visual identity"
auto-req = "no"
assets = [
    { source = "target/release/odytty", dest = "/usr/bin/odytty", mode = "755" },
    { source = "dist/linux/io.unfinished_works.odytty.desktop", dest = "/usr/share/applications/io.unfinished_works.odytty.desktop", mode = "644" },
    { source = "dist/linux/io.unfinished_works.odytty.metainfo.xml", dest = "/usr/share/metainfo/io.unfinished_works.odytty.metainfo.xml", mode = "644" },
    { source = "dist/icons/hicolor/48x48/apps/io.unfinished_works.odytty.png", dest = "/usr/share/icons/hicolor/48x48/apps/io.unfinished_works.odytty.png", mode = "644" },
    { source = "dist/icons/hicolor/64x64/apps/io.unfinished_works.odytty.png", dest = "/usr/share/icons/hicolor/64x64/apps/io.unfinished_works.odytty.png", mode = "644" },
    { source = "dist/icons/hicolor/128x128/apps/io.unfinished_works.odytty.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.unfinished_works.odytty.png", mode = "644" },
    { source = "dist/icons/hicolor/256x256/apps/io.unfinished_works.odytty.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.unfinished_works.odytty.png", mode = "644" },
    { source = "dist/icons/hicolor/scalable/apps/io.unfinished_works.odytty.svg", dest = "/usr/share/icons/hicolor/scalable/apps/io.unfinished_works.odytty.svg", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/odytty/README.md", mode = "644" },
    { source = "NOTICE", dest = "/usr/share/doc/odytty/NOTICE", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/odytty/LICENSE", mode = "644" },
]

[package.metadata.generate-rpm.requires]
fontconfig = "*"
freetype = "*"
vulkan-loader = "*"
libxkbcommon = "*"
hicolor-icon-theme = "*"
