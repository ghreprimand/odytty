name: CI

# Build + test on both supported platforms. Runs on pushes to master and on
# pull requests. Uses only standard GitHub-hosted runners (ubuntu-latest,
# macos-latest) — free with no quota for public repositories, and ephemeral, so
# this never touches a self-hosted runner. Produces no artifacts; this is a
# correctness gate, not a packaging job.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to avoid piling up macOS minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A normal run is ~4 min; an intermittent session-host test hang on the
    # macOS runner can otherwise spin until GitHub's 6-hour default. Fail fast
    # at 15 min (well above a cold toolchain install + build, well below a hang)
    # so a hang surfaces as a clean, quick failure instead of burning minutes.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
