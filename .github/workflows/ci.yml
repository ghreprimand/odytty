name: CI

# Build + test on all three supported platforms. The Windows leg is a blocking
# regression gate alongside Linux and macOS now that the Windows port compiles
# and its unit tests pass. Runs on pushes to master and on
# pull requests. Uses only standard GitHub-hosted runners (ubuntu-latest,
# macos-latest, windows-latest) — free with no quota for public repositories,
# and ephemeral, so this never touches a self-hosted runner. Produces no
# artifacts; this is a correctness gate, not a packaging job.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to avoid piling up macOS minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The macOS runner intermittently deadlocked in tests that spawn real PTYs —
    # a child-reap / PTY-teardown contention specific to macOS (ubuntu + windows
    # were always green). Mitigation is two-layered: the macOS Test step runs
    # single-threaded (`--test-threads=1`) to serialize PTY spawn/teardown, and
    # it auto-retries once under a per-attempt timeout so a transient hang
    # self-heals instead of needing a manual re-run (see the macOS Test step
    # below for the mechanism and why it cannot mask a real failure). Because two
    # 12-min test attempts can stack on top of a cold release+debug build
    # (~8-12 min; `target` is no longer cached — see the Cache step), the macOS
    # job needs a wider ceiling: 40 min fits a cold build + clippy + two test
    # attempts, while ubuntu/windows keep the tight 25-min fail-fast tripwire
    # (single test attempt, comfortably above a cold build, well below a hang).
    timeout-minutes: ${{ matrix.os == 'macos-latest' && 40 || 25 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Cache only the dependency-download dirs (~/.cargo), NOT `target`.
      # `target` grows without bound across runs, and with `restore-keys`
      # fallback every run restored an ever-larger compiled-artifact cache,
      # rebuilt more into it, then saved a bigger one — until the ubuntu
      # runner hit "No space left on device" during cache restore (the macOS
      # leg, with a roomier disk, stayed green). Dropping `target` keeps the
      # cache bounded; a fresh build each run costs ~2 min but never exhausts
      # disk. The `-v2-` key prefix retires the old bloated caches (they were
      # saved under the previous prefix and would otherwise be pulled back in
      # by restore-keys); they age out via GitHub's cache eviction.
      - name: Cache cargo registry
        # v4.2.0
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ matrix.os }}-cargo-v2-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-v2-

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # Linux/Windows: a single `cargo test --locked` attempt, parallel.
      # Step-level timeout: a wedged test must fail THIS step in ~15 min, not
      # spin until the job backstop. Run 28609779371 (a P2-FIX resize pressure
      # test that deadlocked on an undrained ConPTY pipe) ate 25m37s before
      # reporting red — the job-level ceiling is too coarse to fail fast. Normal
      # full-suite test steps finish in ~2-3 min here (windows ~153s is the
      # slowest), so 15 min is ~6x headroom over green while tripping quickly on
      # a hang. macOS is handled by the separate auto-retry step below.
      - name: Test (Linux/Windows)
        if: matrix.os != 'macos-latest'
        timeout-minutes: 15
        run: cargo test --locked

      # macOS: the runner intermittently deadlocked (~1 in 6-7 runs) during
      # PTY teardown in the single-threaded test sweep — the tests run clean,
      # then a silent multi-minute dead gap in a PTY-spawning region, then
      # GitHub reaps the orphaned process at the step timeout and the leg goes
      # red. It is a child-reap / PTY-teardown contention specific to the macOS
      # runner, not an OdyTTY regression (ubuntu + windows never hit it, and a
      # plain re-run clears it every time). This step self-heals that transient
      # hang: it runs the single-threaded macOS suite under a portable
      # per-attempt timeout and retries once. A genuine failure (assertion,
      # compile error, real nonzero exit) fails BOTH attempts and still reports
      # red, so nothing is masked; only a transient hang benefits from the retry
      # (two independent hangs is ~(1/6)^2 ~= 3%).
      #
      # Mechanism (dependency-free — no third-party actions; BSD userland has no
      # GNU `timeout`): a small perl wrapper forks the test into its own session
      # (POSIX::setsid, so its process-group id equals its pid), waits with an
      # alarm, and on timeout signals the whole process GROUP (TERM, 5s grace,
      # then KILL) so a wedged PTY test tree is actually reaped rather than
      # orphaned. Between attempts, any stray cargo test binary (matched by the
      # narrow `odytty-<hex>` name pattern, never a bare `odytty`) is
      # force-killed so a wedged tree from attempt 1 cannot taint attempt 2.
      #
      # Budget: per-attempt timeout 360s (6 min). Pure UI tests no longer own a
      # real PTY (a headless session source backs them), so the fixture
      # spawn/teardown that drove the transient wedge is gone from the bulk of
      # the suite; a green single-threaded macOS run is ~2-3 min and the slowest
      # recent non-retry run was ~195s, so 360s keeps ~165s of headroom (~1.85x)
      # while cutting the failure latency of a genuine hang in half. Two attempts
      # cap the retried command near ~12 min; the 30-min step backstop sits well
      # above that so the per-attempt timeout is what trips first (a step timeout
      # below 2x per-attempt would kill the loop mid-retry and defeat it). The
      # macOS job ceiling (above) is 40 min to fit a cold build + clippy + two
      # test attempts; ubuntu/windows keep the tight 25-min job ceiling.
      - name: Test (macOS, auto-retry PTY-teardown deadlock)
        if: matrix.os == 'macos-latest'
        timeout-minutes: 30
        run: |
          attempt_timeout=360
          max_attempts=2

          run_with_timeout() {
            local secs="$1"; shift
            perl -e '
              use POSIX qw(setsid);
              my $timeout = shift @ARGV;
              my $pid = fork();
              defined($pid) or die "fork: $!\n";
              if ($pid == 0) { POSIX::setsid(); exec @ARGV or die "exec: $!\n"; }
              my $rc = 0;
              eval {
                local $SIG{ALRM} = sub { die "timeout\n"; };
                alarm($timeout);
                waitpid($pid, 0);
                $rc = $?;
                alarm(0);
              };
              if ($@) {
                alarm(0);
                kill("TERM", -$pid); sleep(5); kill("KILL", -$pid);
                waitpid($pid, 0);
                exit(124);
              }
              exit(($rc & 127) ? 128 + ($rc & 127) : ($rc >> 8));
            ' "$secs" "$@"
          }

          rc=0
          for attempt in $(seq 1 "$max_attempts"); do
            echo "macOS test attempt ${attempt}/${max_attempts}"
            rc=0
            run_with_timeout "$attempt_timeout" cargo test --locked -- --test-threads=1 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo "Test attempt ${attempt} succeeded."
              break
            fi
            echo "Test attempt ${attempt} exited ${rc}."
            # Narrow to the cargo test-binary name (odytty-<hex>, e.g.
            # odytty-2cce29a4); this cannot match a bare `odytty` binary. The
            # per-attempt process-group kill already reaps the test tree, so
            # this is only a belt-and-braces sweep for a stray test binary.
            pkill -9 -f 'odytty-[0-9a-f]' || true
            if [ "$attempt" -lt "$max_attempts" ]; then
              echo "Retrying after PTY-teardown cleanup..."
              sleep 3
            fi
          done
          exit "$rc"

      # TEST-HANG regression guard (Linux only — the wedge is a unix-pipe
      # phenomenon): a `cargo test` whose stdout pipe closes early must
      # TERMINATE, never wedge. See scripts/piped-test-guard.sh for the full
      # failure-mode writeup. The binary is already built by the Test step, so
      # this adds seconds, not minutes. A tight step timeout is doubly apt here:
      # this step exists precisely to catch a wedge, so it must never become one
      # itself (runs in <1s green; 5 min is a generous tripwire).
      - name: Piped-close test guard
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: bash scripts/piped-test-guard.sh


  # Architectural size rule for Rust source a normal build compiles. Cheap,
  # deterministic, and offline: no toolchain, no compile, no network. It runs
  # as its own job rather than inside the build matrix so a size regression
  # reports in seconds instead of behind a release build, and so the answer is
  # identical on every runner (the rule is about source text, not about a
  # platform).
  #
  # The classifier self-tests run first and are part of the gate. The guard
  # decides production vs test-only by walking the module graph, so a defect in
  # that walk would silently stop measuring product code -- exactly the failure
  # the rule exists to prevent -- and the self-tests are what make that defect
  # loud. `coverage-surfaces.py` is tested here too because the guard imports
  # its cfg evaluator.
  architecture-guards:
    name: Architecture guards (production Rust file size)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          # This job only reads source text; it never pushes. Leaving the
          # checkout token out of .git/config keeps it away from the scripts
          # this job runs.
          persist-credentials: false

      - name: Classifier self-tests
        run: |
          python3 scripts/production-file-guard.py --self-test
          python3 scripts/coverage-surfaces.py --self-test

      - name: Production Rust file-size guard
        # The recorded backlog forgives the files the decomposition work has
        # not reached yet and nothing else: a new oversized file, a recorded
        # file that grew, a stale entry, or a source file no crate root reaches
        # all fail here. Entries leave scripts/production-file-baseline.tsv as
        # the files are split; when it is empty, drop the flag.
        run: >-
          python3 scripts/production-file-guard.py
          --baseline scripts/production-file-baseline.tsv


  # Lint + smoke-test the shipped shell scripts (the hosted install.sh one-liner
  # and the tarball's local installer). shellcheck is preinstalled on the ubuntu
  # runner. The --dry-run smoke exercises the installer's OS/arch/manager
  # detection and planning without downloading or installing anything.
  shell-scripts:
    name: Shell scripts (shellcheck + install smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        # v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: shellcheck
        run: |
          shellcheck dist/install.sh dist/linux/tarball-install.sh \
            .github/scripts/verify-release-ci.sh \
            .github/scripts/verify-release-ci-test.sh \
            .github/scripts/await-release-ci.sh \
            .github/scripts/await-release-ci-test.sh

      - name: install.sh dry-run smoke
        run: bash dist/install.sh --dry-run

      - name: Release CI-gate fixtures
        # Deterministic fixtures for the fail-closed same-commit CI release gate
        # (.github/scripts/verify-release-ci.sh). Pure and offline; asserts every
        # missing/cancelled/failed/other-commit state fails closed, that a run
        # still queued/in-progress reports UNDECIDED rather than either verdict,
        # and that only a completed success for the exact commit passes.
        run: bash .github/scripts/verify-release-ci-test.sh

      - name: Release CI-gate waiter fixtures
        # Fixtures for the bounded waiter (.github/scripts/await-release-ci.sh)
        # that lets the gate ride out a same-commit CI run still in progress.
        # Offline: a scripted stub replays canned API payloads, pinning that a
        # pending run is waited out, a red/missing/other-commit run fails on the
        # first look with no polling, and a deadline fails closed.
        run: bash .github/scripts/await-release-ci-test.sh
