name: CI

# Build + test on both supported platforms. Runs on pushes to master and on
# pull requests. Uses only standard GitHub-hosted runners (ubuntu-latest,
# macos-latest) — free with no quota for public repositories, and ephemeral, so
# this never touches a self-hosted runner. Produces no artifacts; this is a
# correctness gate, not a packaging job.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to avoid piling up macOS minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A normal run is ~4 min. The macOS runner intermittently deadlocked
    # (~1 in 4 runs) in tests that spawn real PTYs under parallel `cargo test`
    # — a child-reap / PTY-teardown contention specific to macOS (Ubuntu was
    # always green). Mitigation: the Test step runs single-threaded on macOS
    # only (`--test-threads=1`), which serializes PTY spawn/teardown; Ubuntu
    # stays parallel/fast. The 15-min timeout is kept as the fail-fast tripwire
    # (well above a cold toolchain install + build, well below a hang) so any
    # residual hang still surfaces as a clean, quick failure rather than
    # spinning until GitHub's 6-hour default.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ matrix.os }}-cargo-

      - name: Format check
        run: cargo fmt --check

      - name: Build
        run: cargo build --release --locked

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      # macOS runs single-threaded to serialize parallel-PTY child-reap
      # contention (see the timeout-minutes note above); Ubuntu stays parallel.
      - name: Test
        run: cargo test --locked ${{ matrix.os == 'macos-latest' && '-- --test-threads=1' || '' }}
