# Dev build: manually triggered (workflow_dispatch) Windows zip and macOS app
# zip from any ref.
#
# Purpose: produce testable Windows and macOS binaries WITHOUT cutting a
# release, for hands-on acceptance of unreleased work. Each zip is uploaded as
# a short-lived Actions artifact (NOT a release asset, NOT for distribution;
# the macOS app carries only the ad-hoc signature, like the release build).
# Mirrors the packaging shape of release.yml's `windows` and `macos` jobs,
# minus tag-derived versioning.
#
# Usage: Actions tab -> "Dev build (Windows zip, macOS app)" -> Run workflow ->
# pick the branch -> download the `odytty-dev-windows-x86_64` or
# `odytty-dev-macos-arm64` artifact from the run page.
name: Dev build (Windows zip, macOS app)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows dev zip (x86_64)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      ODYTTY_BUILD_SHA: ${{ github.sha }}
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=."
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pinned native-package verifier
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.100'

      - name: Verify bundled ConPTY package online
        shell: pwsh
        timeout-minutes: 5
        run: |
          & ./scripts/conpty-runtime/Test-Tools.ps1
          & ./scripts/conpty-runtime/Prepare.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'verified-conpty')

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage bundled ConPTY beside executables
        shell: pwsh
        timeout-minutes: 2
        run: |
          & ./scripts/conpty-runtime/Stage.ps1 -Runtime (Join-Path $env:RUNNER_TEMP 'verified-conpty') -Destination @('target/debug', 'target/debug/deps', 'target/release')

      - name: Smoke test the Windows binary
        # --version exits before any GPU/window init, so it runs headlessly in CI.
        run: ./target/release/odytty.exe --version

      - name: Package Windows dev zip
        shell: pwsh
        # C40: pass the ref-derived values through env so the pwsh script
        # references quoted $env:VARs instead of interpolating the workflow
        # expressions directly (a branch name is attacker-influenceable).
        env:
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          $sha = "$env:COMMIT_SHA".Substring(0, 9)
          New-Item -ItemType Directory -Force dist/build | Out-Null
          & ./scripts/conpty-runtime/Package.ps1 -Binary target/release/odytty.exe -Runtime (Join-Path $env:RUNNER_TEMP 'verified-conpty') -Destination dist/windows/package
          Set-Content -Path dist/windows/package/DEV-BUILD.txt -Value @"
          Unreleased development build of OdyTTY.
          Commit: $env:COMMIT_SHA
          Ref:    $env:REF_NAME
          Not a release artifact; do not redistribute.
          "@
          Compress-Archive `
            -Path dist/windows/package/* `
            -DestinationPath "dist/build/odytty-dev-$sha-windows-x86_64.zip" `
            -Force

      - name: Upload Windows dev artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odytty-dev-windows-x86_64
          path: dist/build/*.zip
          retention-days: 7

  macos:
    name: macOS dev app zip (arm64)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=."
      # Embed the exact commit in the About panel (build.rs provenance
      # precedence). Set at job scope, not inside a run: body.
      ODYTTY_BUILD_SHA: ${{ github.sha }}
      COMMIT_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test the macOS binary
        # --version exits before any GPU/window init, so it runs headlessly in CI.
        run: ./target/release/odytty --version

      - name: Assemble and ad-hoc sign OdyTTY.app
        run: |
          version="$(bash .github/scripts/manifest-version.sh)"
          mkdir -p dist/build
          cp target/release/odytty dist/build/odytty
          bash dist/macos/make-app.sh "$version"
          printf 'Unreleased development build of OdyTTY.\nCommit: %s\nRef:    %s\nNot a release artifact; do not redistribute.\n' \
            "$COMMIT_SHA" "$REF_NAME" > dist/build/DEV-BUILD.txt
          codesign --force --sign - --timestamp=none dist/build/OdyTTY.app
          codesign --verify --verbose dist/build/OdyTTY.app

      - name: Package macOS dev zip
        run: |
          sha="${COMMIT_SHA:0:9}"
          mkdir -p dist/build/stage
          cp -R dist/build/OdyTTY.app dist/build/stage/
          cp dist/build/DEV-BUILD.txt dist/build/stage/
          # ditto preserves the .app bundle structure; a plain zip can corrupt it.
          ditto -c -k --sequesterRsrc dist/build/stage \
            "dist/build/odytty-dev-$sha-macos-arm64.zip"

      - name: Upload macOS dev artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: odytty-dev-macos-arm64
          path: dist/build/*.zip
          retention-days: 7
