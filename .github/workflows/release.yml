name: Release

# Publishes a GitHub Release when a version tag (vX.Y.Z) is pushed. OdyTTY ships
# a source tarball, a best-effort Linux x86_64 AppImage, and an unsigned Windows
# x86_64 zip, all checksummed in SHA256SUMS. Tag pushes are restricted to
# maintainers, so this never runs from fork pull requests. A failed producer job
# publishes nothing (the release job needs every build job).
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  source:
    name: Source tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        run: |
          mkdir -p dist/build
          git archive --format=tar.gz \
            --prefix="odytty-${{ steps.ver.outputs.version }}/" \
            -o "dist/build/odytty-${{ steps.ver.outputs.version }}.tar.gz" HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/build/*.tar.gz

  appimage:
    name: AppImage (x86_64)
    # Built on the oldest supported Ubuntu LTS so the bundle links against an
    # old glibc floor and runs on a wide range of distros. The graphics stack
    # (libvulkan/libGL/X11/Wayland) is intentionally NOT bundled — the host
    # must provide a working Vulkan driver (Mesa or vendor ICD).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build AppImage
        run: dist/appimage/build-appimage.sh "${{ steps.ver.outputs.version }}"

      - name: Smoke test the AppImage
        # --version exits before any GPU/window init, so it runs headlessly in
        # CI; this confirms the bundle's loader, libs, and entrypoint are sound.
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 \
            ./odytty-${{ steps.ver.outputs.version }}-x86_64.AppImage --version

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: odytty-*-x86_64.AppImage

  windows:
    name: Windows zip (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=."
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test the Windows binary
        # --version exits before any GPU/window init, so it runs headlessly in CI.
        run: ./target/release/odytty.exe --version

      - name: Package Windows zip
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist/windows/package | Out-Null
          New-Item -ItemType Directory -Force dist/build | Out-Null
          Copy-Item target/release/odytty.exe dist/windows/package/
          Copy-Item README.md, LICENSE, NOTICE dist/windows/package/
          Compress-Archive `
            -Path dist/windows/package/* `
            -DestinationPath "dist/build/odytty-$version-windows-x86_64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/build/*.zip

  release:
    name: Publish release
    needs: [source, appimage, windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts and checksum
        run: |
          mkdir -p out
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.zip' \) -exec cp {} out/ \;
          cd out
          # Version-less aliases so `releases/latest/download/<name>` resolves a
          # stable URL the README can use without ever naming a version. These
          # are copies of the versioned artifacts (same bytes), checksummed
          # alongside them in SHA256SUMS.
          version="${{ steps.ver.outputs.version }}"
          cp "odytty-${version}.tar.gz" "odytty.tar.gz"
          cp "odytty-${version}-x86_64.AppImage" "odytty-x86_64.AppImage"
          cp "odytty-${version}-windows-x86_64.zip" "odytty-windows-x86_64.zip"
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tar.gz
            out/*.AppImage
            out/*.zip
            out/SHA256SUMS
          # Static preamble above the auto-generated notes, clarifying that the
          # version-less and version-pinned downloads are identical copies.
          body: |
            ### Downloads

            `odytty-x86_64.AppImage`, `odytty-windows-x86_64.zip`, and
            `odytty.tar.gz` are the **always-latest** names — use these for a
            stable URL that resolves to the newest release. The
            `…-${{ steps.ver.outputs.version }}-…` files are the **identical**
            version-pinned copies (same bytes), for when you want to pin a
            specific version. Every file is checksummed in `SHA256SUMS`; each
            alias and its version-pinned twin therefore show matching hashes.

            ---
          generate_release_notes: true
          fail_on_unmatched_files: true

  scoop:
    name: Bump Scoop manifest
    # Runs only after the GitHub Release (and its SHA256SUMS asset) is published,
    # then bumps bucket/odytty.json's pinned version/url/hash and pushes it to
    # master. This closes the manual-lag window: without it, `scoop update
    # odytty` serves the previous version until a maintainer hand-edits the
    # manifest (v0.7.1 lagged its tag by hours). The Scoop CLIENT reads only the
    # pinned fields — the manifest's autoupdate block is maintainer tooling
    # (checkver/Excavator) and does NOT keep installed clients current on its
    # own, so this per-release bump is required.
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download SHA256SUMS from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS \
            --output SHA256SUMS
          test -s SHA256SUMS || { echo "::error::SHA256SUMS is empty or missing" >&2; exit 1; }

      - name: Rewrite bucket/odytty.json
        id: manifest
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          zip="odytty-${version}-windows-x86_64.zip"
          hash="$(awk -v f="$zip" '$2 == f { print $1 }' SHA256SUMS)"
          if [ -z "$hash" ]; then
            echo "::error::No SHA256 entry for ${zip} in SHA256SUMS" >&2
            exit 1
          fi
          current="$(jq -r '.version' bucket/odytty.json)"
          if [ "$current" = "$version" ]; then
            echo "Manifest already at ${version}; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${zip}"
          tmp="$(mktemp)"
          jq --arg v "$version" --arg u "$url" --arg h "$hash" \
            '.version = $v
             | .architecture["64bit"].url = $u
             | .architecture["64bit"].hash = $h' \
            bucket/odytty.json > "$tmp"
          mv "$tmp" bucket/odytty.json
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Bumped manifest to ${version} (hash ${hash})."

      - name: Commit and push the manifest bump
        if: steps.manifest.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/odytty.json
          git commit -m "Scoop: bump manifest to v${version}"
          # Guard against a concurrent push racing this one: on rejection, rebase
          # the single manifest commit onto the latest master and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed manifest bump on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing on origin/master and retrying."
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::Failed to push Scoop manifest bump after 5 attempts" >&2
          exit 1

  aur:
    name: Publish AUR package
    # Mirrors the `scoop` job: needs the published release so the source tarball
    # and its SHA256SUMS exist. Runs in an Arch container for makepkg / updpkgsums
    # / namcap, and pushes to the SEPARATE AUR git repo (not this repo's master).
    #
    # The AUR package is currently community-maintained (an external packager
    # tracks the GitHub releases), so upstream does not self-publish. When no
    # AUR_SSH_PRIVATE_KEY secret is configured, the push step skips cleanly and
    # the job stays green — the PKGBUILD is still stamped and namcap-linted as a
    # validation gate. To take over upstream publishing later, obtain maintainer
    # rights to the `odytty` pkgbase, add the secret, and re-run; the push then
    # activates automatically. This job runs AFTER `release` has published the
    # GitHub release, so nothing already published depends on it.
    needs: [release]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    permissions:
      contents: read
    steps:
      - name: Install tooling
        run: pacman -Sy --noconfirm --needed git openssh namcap pacman-contrib

      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stamp PKGBUILD, fill checksum, regenerate .SRCINFO, lint
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          # makepkg and updpkgsums refuse to run as root, so do all packaging
          # work as an unprivileged build user that owns the template dir.
          useradd -m builder
          chown -R builder:builder dist/aur
          runuser -u builder -- env "PKGVER=$version" bash -euo pipefail -c '
            cd dist/aur
            # Stamp the release version; the source= URL then resolves to the
            # just-published release tarball.
            sed -i -e "s/^pkgver=.*/pkgver=${PKGVER}/" -e "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
            # Replace the SKIP placeholder with the real release-tarball sha256.
            updpkgsums
            # Regenerate .SRCINFO from the stamped PKGBUILD — never hand-write.
            makepkg --printsrcinfo > .SRCINFO
            # Static lint is the blocking gate: namcap exits 0 even on errors, so
            # fail the job when any "E:" line is present.
            { namcap PKGBUILD || true; } | tee /tmp/namcap.log
            if grep -qE " E: " /tmp/namcap.log; then
              echo "::error::namcap reported PKGBUILD errors (see log above)"
              exit 1
            fi
          '

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "AUR publish skipped: no AUR_SSH_PRIVATE_KEY configured."
            echo "The AUR package is community-maintained; upstream does not self-publish this release. Nothing to do."
            exit 0
          fi
          install -d -m700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          # Pin the AUR host key: scan it, then verify the scanned key against the
          # PUBLISHED Ed25519 fingerprint before trusting it (no blind TOFU).
          ssh-keyscan -t ed25519 aur.archlinux.org > ~/.ssh/known_hosts 2>/dev/null
          fp="$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')"
          expected="SHA256:RFzBCUItH9LZS0cKB5UE6ceAYhBD5C8GeOBip8Z11+4"
          if [ "$fp" != "$expected" ]; then
            echo "::error::AUR host key fingerprint mismatch: got '$fp' expected '$expected'"
            exit 1
          fi
          printf 'Host aur.archlinux.org\n  User aur\n  IdentityFile ~/.ssh/aur\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          git config --global user.name "OdyTTY release bot"
          git config --global user.email "maintainers@odytty.unfinished-works.com"
          git config --global --add safe.directory '*'
          git clone ssh://aur@aur.archlinux.org/odytty.git aur-repo
          # Idempotency guard (mirrors Scoop's version check): skip if the AUR
          # repo already carries this pkgver.
          if grep -qE "^[[:space:]]*pkgver = ${version}$" aur-repo/.SRCINFO 2>/dev/null; then
            echo "AUR already at ${version}; nothing to do."
            exit 0
          fi
          cp dist/aur/PKGBUILD dist/aur/.SRCINFO aur-repo/
          cd aur-repo
          git add PKGBUILD .SRCINFO
          git commit -m "odytty ${version}-1"
          git push origin HEAD:master
