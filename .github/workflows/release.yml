name: Release

# Publishes a GitHub Release when a version tag (vX.Y.Z) is pushed. OdyTTY ships
# a source tarball, a best-effort Linux x86_64 AppImage, and an unsigned Windows
# x86_64 zip, all checksummed in SHA256SUMS. Tag pushes are restricted to
# maintainers, so this never runs from fork pull requests. A failed producer job
# publishes nothing (the release job needs every build job).
on:
  push:
    tags:
      - "v*.*.*"
  # Manual runs build and upload every artifact (including the new Linux
  # packages) WITHOUT publishing: the release/scoop/homebrew/aur jobs are guarded
  # to tag refs, so a workflow_dispatch validates the producer jobs before a tag
  # is cut. On a non-tag run the version is read from Cargo.toml instead of the
  # tag name.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  source:
    name: Source tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        run: |
          mkdir -p dist/build
          git archive --format=tar.gz \
            --prefix="odytty-${{ steps.ver.outputs.version }}/" \
            -o "dist/build/odytty-${{ steps.ver.outputs.version }}.tar.gz" HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/build/*.tar.gz

  appimage:
    name: AppImage (x86_64)
    # Built on the oldest supported Ubuntu LTS so the bundle links against an
    # old glibc floor and runs on a wide range of distros. The graphics stack
    # (libvulkan/libGL/X11/Wayland) is intentionally NOT bundled — the host
    # must provide a working Vulkan driver (Mesa or vendor ICD).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build AppImage
        run: dist/appimage/build-appimage.sh "${{ steps.ver.outputs.version }}"

      - name: Smoke test the AppImage
        # --version exits before any GPU/window init, so it runs headlessly in
        # CI; this confirms the bundle's loader, libs, and entrypoint are sound.
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 \
            ./odytty-${{ steps.ver.outputs.version }}-x86_64.AppImage --version

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: odytty-*-x86_64.AppImage

  windows:
    name: Windows zip (x86_64)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=."
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test the Windows binary
        # --version exits before any GPU/window init, so it runs headlessly in CI.
        run: ./target/release/odytty.exe --version

      - name: Package Windows zip
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force dist/windows/package | Out-Null
          New-Item -ItemType Directory -Force dist/build | Out-Null
          Copy-Item target/release/odytty.exe dist/windows/package/
          Copy-Item README.md, LICENSE, NOTICE dist/windows/package/
          Compress-Archive `
            -Path dist/windows/package/* `
            -DestinationPath "dist/build/odytty-$version-windows-x86_64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/build/*.zip

  macos:
    name: macOS app zip (arm64)
    # GitHub's macos-latest runner is Apple Silicon (arm64). Assembles an
    # OdyTTY.app bundle from the release binary, ad-hoc-signs it, and zips it
    # with ditto (which preserves the bundle the way macOS expects). The ad-hoc
    # signature (identity "-") is free and account-less; it is what lets an
    # Apple Silicon Mac launch the app without a Gatekeeper warning once the
    # download's quarantine attribute is removed. No notarization / Developer ID.
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    env:
      RUSTFLAGS: "--remap-path-prefix=${{ github.workspace }}=."
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build release binary
        run: cargo build --release --locked

      - name: Smoke test the macOS binary
        # --version exits before any GPU/window init, so it runs headlessly in CI.
        run: ./target/release/odytty --version

      - name: Assemble and sign OdyTTY.app
        run: |
          version="${{ steps.ver.outputs.version }}"
          mkdir -p dist/build
          cp target/release/odytty dist/build/odytty
          bash dist/macos/make-app.sh "$version"
          # Ad-hoc signature: sign the single-binary bundle plainly. Do NOT use
          # --deep (deprecated and wrong for a one-executable .app); the plain
          # sign covers the binary and the bundle together.
          codesign --force --sign - --timestamp=none dist/build/OdyTTY.app
          codesign --verify --verbose dist/build/OdyTTY.app

      - name: Package macOS zip
        run: |
          version="${{ steps.ver.outputs.version }}"
          # ditto -c -k --keepParent produces a macOS-correct zip that preserves
          # the .app bundle's structure; a plain `zip -r` can corrupt bundles.
          ditto -c -k --sequesterRsrc --keepParent dist/build/OdyTTY.app \
            "dist/build/odytty-$version-macos-arm64.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/build/*.zip

  linux-tarball:
    name: Linux binary tarball (x86_64)
    # A standalone prebuilt binary plus its desktop-integration files, a slim
    # alternative to the AppImage. Built on the oldest supported Ubuntu LTS
    # (ubuntu-22.04, glibc 2.35) so it runs on a wide range of distros; like the
    # AppImage, the host must provide a working Vulkan driver (Mesa or a vendor
    # ICD). The archive carries a tiny local install.sh (copies the binary and
    # desktop files into a prefix, no download).
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Assemble tarball
        run: |
          version="${{ steps.ver.outputs.version }}"
          stage="odytty-${version}-linux-x86_64"
          mkdir -p "dist/build/${stage}/share/applications" \
                   "dist/build/${stage}/share/metainfo" \
                   "dist/build/${stage}/share/icons/hicolor"
          cp target/release/odytty "dist/build/${stage}/odytty"
          cp dist/linux/tarball-install.sh "dist/build/${stage}/install.sh"
          chmod +x "dist/build/${stage}/install.sh"
          cp README.md LICENSE NOTICE "dist/build/${stage}/"
          cp dist/linux/io.unfinished_works.odytty.desktop \
             "dist/build/${stage}/share/applications/"
          cp dist/linux/io.unfinished_works.odytty.metainfo.xml \
             "dist/build/${stage}/share/metainfo/"
          cp -a dist/icons/hicolor/. "dist/build/${stage}/share/icons/hicolor/"
          tar -C dist/build -czf "dist/build/${stage}.tar.gz" "${stage}"
          ls -l "dist/build/${stage}.tar.gz"

      - name: Smoke test the packaged binary
        # --version exits before any GPU/window init, so it runs headlessly.
        run: ./dist/build/odytty-${{ steps.ver.outputs.version }}-linux-x86_64/odytty --version

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: dist/build/odytty-*-linux-x86_64.tar.gz

  deb:
    name: Debian package (amd64)
    # Native .deb via cargo-deb, packaging the same ubuntu-22.04 release binary.
    # depends is $auto (dpkg-shlibdeps: the ldd-linked glibc/libgcc with version
    # floors) plus the dlopen'd font/Vulkan/xkbcommon libraries declared in
    # Cargo.toml.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install cargo-deb
        # Build the tool with the default stable toolchain (RUSTUP_TOOLCHAIN
        # overrides the repo's pinned 1.96) so the tool's own newer MSRV is not a
        # constraint; the project itself is still built at the pinned 1.96 above.
        run: RUSTUP_TOOLCHAIN=stable cargo install cargo-deb --version 3.7.0 --locked

      - name: Build .deb
        run: |
          version="${{ steps.ver.outputs.version }}"
          # Reuse the already-built release binary (--no-build); cargo-deb strips
          # it and derives $auto shared-lib deps from it.
          cargo deb --no-build
          deb="$(find target/debian -maxdepth 1 -name '*.deb' | head -n1)"
          test -n "$deb" || { echo "::error::no .deb produced"; exit 1; }
          mkdir -p dist/build
          cp "$deb" "dist/build/odytty-${version}-amd64.deb"

      - name: Validate .deb metadata
        run: |
          pkg="$(ls dist/build/odytty-*-amd64.deb | head -n1)"
          dpkg-deb -I "$pkg"
          echo "--- contents ---"
          dpkg-deb -c "$pkg" | head -40

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb
          path: dist/build/*.deb

  rpm:
    name: RPM package (x86_64, best-effort)
    # Native .rpm via cargo-generate-rpm. Best-effort like the AppImage: the rpm
    # is cross-built on Ubuntu and cannot be runtime-tested on the base matrix,
    # only metadata-validated with `rpm -qip`. auto-req is disabled in Cargo.toml
    # and the Fedora-named runtime deps are declared explicitly.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev \
            libxkbcommon-dev libwayland-dev libx11-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install cargo-generate-rpm
        run: RUSTUP_TOOLCHAIN=stable cargo install cargo-generate-rpm --version 0.18.1 --locked

      - name: Build .rpm
        run: |
          version="${{ steps.ver.outputs.version }}"
          # cargo-generate-rpm does not strip; do it first so the payload is slim.
          strip -s target/release/odytty
          cargo generate-rpm
          rpm_file="$(find target/generate-rpm -maxdepth 1 -name '*.rpm' | head -n1)"
          test -n "$rpm_file" || { echo "::error::no .rpm produced"; exit 1; }
          mkdir -p dist/build
          cp "$rpm_file" "dist/build/odytty-${version}-x86_64.rpm"

      - name: Validate .rpm metadata
        run: |
          sudo apt-get install -y --no-install-recommends rpm
          pkg="$(ls dist/build/odytty-*-x86_64.rpm | head -n1)"
          rpm -qip "$pkg"
          echo "--- contents ---"
          rpm -qlp "$pkg" | head -40

      - name: Upload rpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: rpm
          path: dist/build/*.rpm

  release:
    name: Publish release
    # Publishes only for a real tag push; a workflow_dispatch validation run
    # builds the producer jobs but never reaches here.
    if: startsWith(github.ref, 'refs/tags/')
    needs: [source, appimage, linux-tarball, deb, rpm, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts and checksum
        run: |
          mkdir -p out
          find artifacts -type f \
            \( -name '*.tar.gz' -o -name '*.AppImage' -o -name '*.zip' \
               -o -name '*.deb' -o -name '*.rpm' \) -exec cp {} out/ \;
          cd out
          # Version-less aliases so `releases/latest/download/<name>` resolves a
          # stable URL the README can use without ever naming a version. These
          # are copies of the versioned artifacts (same bytes), checksummed
          # alongside them in SHA256SUMS.
          version="${{ steps.ver.outputs.version }}"
          cp "odytty-${version}.tar.gz" "odytty.tar.gz"
          cp "odytty-${version}-x86_64.AppImage" "odytty-x86_64.AppImage"
          cp "odytty-${version}-windows-x86_64.zip" "odytty-windows-x86_64.zip"
          cp "odytty-${version}-macos-arm64.zip" "odytty-macos-arm64.zip"
          cp "odytty-${version}-linux-x86_64.tar.gz" "odytty-linux-x86_64.tar.gz"
          cp "odytty-${version}-amd64.deb" "odytty-amd64.deb"
          cp "odytty-${version}-x86_64.rpm" "odytty-x86_64.rpm"
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tar.gz
            out/*.AppImage
            out/*.zip
            out/*.deb
            out/*.rpm
            out/SHA256SUMS
          # Static preamble above the auto-generated notes, clarifying that the
          # version-less and version-pinned downloads are identical copies.
          body: |
            ### Downloads

            **Linux** ships four choices: the portable `odytty-x86_64.AppImage`,
            a prebuilt binary tarball `odytty-linux-x86_64.tar.gz`, a native
            `odytty-amd64.deb` (apt/dpkg), and a best-effort `odytty-x86_64.rpm`
            (dnf/rpm). A one-line installer picks the right one automatically:
            `curl -fsSL https://raw.githubusercontent.com/ghreprimand/odytty/master/dist/install.sh | bash`.
            **Windows** is `odytty-windows-x86_64.zip` (Scoop); **macOS** is
            `odytty-macos-arm64.zip` (Homebrew cask).

            `odytty-x86_64.AppImage`, `odytty-linux-x86_64.tar.gz`,
            `odytty-amd64.deb`, `odytty-x86_64.rpm`,
            `odytty-windows-x86_64.zip`, `odytty-macos-arm64.zip`, and
            `odytty.tar.gz` are the **always-latest** names — use these for a
            stable URL that resolves to the newest release. The
            `…-${{ steps.ver.outputs.version }}-…` files are the **identical**
            version-pinned copies (same bytes), for when you want to pin a
            specific version. Every file is checksummed in `SHA256SUMS`; each
            alias and its version-pinned twin therefore show matching hashes.

            ---
          generate_release_notes: true
          fail_on_unmatched_files: true

  scoop:
    name: Bump Scoop manifest
    # Runs only after the GitHub Release (and its SHA256SUMS asset) is published,
    # then bumps bucket/odytty.json's pinned version/url/hash and pushes it to
    # master. This closes the manual-lag window: without it, `scoop update
    # odytty` serves the previous version until a maintainer hand-edits the
    # manifest (v0.7.1 lagged its tag by hours). The Scoop CLIENT reads only the
    # pinned fields — the manifest's autoupdate block is maintainer tooling
    # (checkver/Excavator) and does NOT keep installed clients current on its
    # own, so this per-release bump is required.
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download SHA256SUMS from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS \
            --output SHA256SUMS
          test -s SHA256SUMS || { echo "::error::SHA256SUMS is empty or missing" >&2; exit 1; }

      - name: Rewrite bucket/odytty.json
        id: manifest
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          zip="odytty-${version}-windows-x86_64.zip"
          hash="$(awk -v f="$zip" '$2 == f { print $1 }' SHA256SUMS)"
          if [ -z "$hash" ]; then
            echo "::error::No SHA256 entry for ${zip} in SHA256SUMS" >&2
            exit 1
          fi
          current="$(jq -r '.version' bucket/odytty.json)"
          if [ "$current" = "$version" ]; then
            echo "Manifest already at ${version}; nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${zip}"
          tmp="$(mktemp)"
          jq --arg v "$version" --arg u "$url" --arg h "$hash" \
            '.version = $v
             | .architecture["64bit"].url = $u
             | .architecture["64bit"].hash = $h' \
            bucket/odytty.json > "$tmp"
          mv "$tmp" bucket/odytty.json
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Bumped manifest to ${version} (hash ${hash})."

      - name: Commit and push the manifest bump
        if: steps.manifest.outputs.changed == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/odytty.json
          git commit -m "Scoop: bump manifest to v${version}"
          # Guard against a concurrent push racing this one: on rejection, rebase
          # the single manifest commit onto the latest master and retry.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "Pushed manifest bump on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing on origin/master and retrying."
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::Failed to push Scoop manifest bump after 5 attempts" >&2
          exit 1

  homebrew:
    name: Bump Homebrew tap
    # Mirrors the `scoop` job's structure but pushes to a SEPARATE repo (the
    # `ghreprimand/homebrew-odytty` tap) the way the `aur` job pushes to the AUR
    # remote — so it needs an explicit push credential, not GITHUB_TOKEN. The
    # channel is cask-primary (the prebuilt .app zip) with a source-build formula
    # fallback; the canonical recipes live in dist/homebrew/ and are stamped from
    # the published SHA256SUMS and pushed to the tap here.
    #
    # GUARDED (mirrors the AUR job): when HOMEBREW_TAP_DEPLOY_KEY is unset the
    # push step exits 0 with an explanatory echo — the recipes are still rewritten
    # locally as a validation gate, but nothing publishes. So the job is green
    # from day one; the operator activates the channel by creating the tap repo
    # and adding the deploy-key secret. Runs AFTER `release` so the macOS zip, the
    # source tarball, and SHA256SUMS all exist.
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download SHA256SUMS from the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern SHA256SUMS \
            --output SHA256SUMS
          test -s SHA256SUMS || { echo "::error::SHA256SUMS is empty or missing" >&2; exit 1; }

      - name: Stamp the canonical recipes
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          cask_zip="odytty-${version}-macos-arm64.zip"
          src_tarball="odytty-${version}.tar.gz"
          cask_hash="$(awk -v f="$cask_zip" '$2 == f { print $1 }' SHA256SUMS)"
          src_hash="$(awk -v f="$src_tarball" '$2 == f { print $1 }' SHA256SUMS)"
          if [ -z "$cask_hash" ]; then
            echo "::error::No SHA256 entry for ${cask_zip} in SHA256SUMS" >&2
            exit 1
          fi
          if [ -z "$src_hash" ]; then
            echo "::error::No SHA256 entry for ${src_tarball} in SHA256SUMS" >&2
            exit 1
          fi
          # Cask: the url interpolates #{version}, so only version + sha256 move.
          sed -i \
            -e "s/^  version \".*\"/  version \"${version}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${cask_hash}\"/" \
            dist/homebrew/Casks/odytty.rb
          # Formula: Homebrew derives the version from the url, so rewrite the
          # url (carrying both version fields) and the sha256.
          src_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}/${src_tarball}"
          sed -i \
            -e "s|^  url \".*\"|  url \"${src_url}\"|" \
            -e "s/^  sha256 \".*\"/  sha256 \"${src_hash}\"/" \
            dist/homebrew/Formula/odytty.rb
          echo "Stamped cask (${cask_hash}) and formula (${src_hash}) to ${version}."

      - name: Push to the Homebrew tap
        env:
          HOMEBREW_TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          version="${{ steps.ver.outputs.version }}"
          if [ -z "${HOMEBREW_TAP_DEPLOY_KEY:-}" ]; then
            echo "Homebrew publish skipped: no HOMEBREW_TAP_DEPLOY_KEY configured."
            echo "The tap is operator-gated; create ghreprimand/homebrew-odytty and add the deploy key to activate. Nothing to do."
            exit 0
          fi
          install -d -m700 ~/.ssh
          printf '%s\n' "$HOMEBREW_TAP_DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pin GitHub's Ed25519 host key: scan it, then verify against the
          # PUBLISHED fingerprint before trusting it (no blind TOFU).
          ssh-keyscan -t ed25519 github.com > ~/.ssh/known_hosts 2>/dev/null
          fp="$(ssh-keygen -lf ~/.ssh/known_hosts | awk '{print $2}')"
          expected="SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU"
          if [ "$fp" != "$expected" ]; then
            echo "::error::GitHub host key fingerprint mismatch: got '$fp' expected '$expected'"
            exit 1
          fi
          printf 'Host github.com\n  User git\n  IdentityFile ~/.ssh/id_ed25519\n  IdentitiesOnly yes\n' > ~/.ssh/config
          chmod 600 ~/.ssh/config
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone git@github.com:ghreprimand/homebrew-odytty.git tap-repo
          branch="$(git -C tap-repo rev-parse --abbrev-ref HEAD)"
          # Idempotency guard (mirrors scoop/aur): skip if the tap's cask already
          # carries this version.
          if grep -qE "^[[:space:]]*version \"${version}\"" tap-repo/Casks/odytty.rb 2>/dev/null; then
            echo "Tap already at ${version}; nothing to do."
            exit 0
          fi
          mkdir -p tap-repo/Casks tap-repo/Formula
          cp dist/homebrew/Casks/odytty.rb tap-repo/Casks/odytty.rb
          cp dist/homebrew/Formula/odytty.rb tap-repo/Formula/odytty.rb
          cd tap-repo
          git add Casks/odytty.rb Formula/odytty.rb
          git commit -m "Homebrew: bump to v${version}"
          # Guard against a concurrent push racing this one: on rejection, rebase
          # onto the latest tap branch and retry (mirrors the Scoop loop).
          for attempt in 1 2 3 4 5; do
            if git push origin "HEAD:${branch}"; then
              echo "Pushed Homebrew bump on attempt ${attempt}."
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); rebasing on origin/${branch} and retrying."
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done
          echo "::error::Failed to push Homebrew tap bump after 5 attempts" >&2
          exit 1

  aur:
    name: Publish AUR package
    # Delegates to the reusable aur-publish workflow, the single source of truth
    # for stamping the PKGBUILD and pushing to AUR over a host-key-pinned ssh
    # channel. Needs the published release so the source tarball and its
    # SHA256SUMS exist; guarded to tag refs so it never runs on a workflow_dispatch
    # validation build (use the aur-publish workflow's own manual trigger for a
    # backfill).
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    uses: ./.github/workflows/aur-publish.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
