name: Release

# Publishes a GitHub Release when a version tag (vX.Y.Z) is pushed. OdyTTY ships
# as source only: the single artifact is a source tarball (plus SHA256SUMS) that
# builds on both Linux and macOS. Tag pushes are restricted to maintainers, so
# this never runs from fork pull requests. A failed build publishes nothing.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  source:
    name: Source tarball
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create source archive
        run: |
          mkdir -p dist/build
          git archive --format=tar.gz \
            --prefix="odytty-${{ steps.ver.outputs.version }}/" \
            -o "dist/build/odytty-${{ steps.ver.outputs.version }}.tar.gz" HEAD

      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: dist/build/*.tar.gz

  release:
    name: Publish release
    needs: [source]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect artifacts and checksum
        run: |
          mkdir -p out
          find artifacts -type f -name '*.tar.gz' -exec cp {} out/ \;
          cd out
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.tar.gz
            out/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
