name: Coverage-guided fuzz

# Scheduled and manual discovery lane for the retained parser and graphics
# corpora. Targets run sequentially inside bounded transient cgroups. A failure
# uploads the corpus, crash artifact, and per-target logs for minimization and
# promotion into the ordinary regression suite.
on:
  schedule:
    - cron: "17 4 * * 4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-guided-fuzz
  cancel-in-progress: false

jobs:
  parser-graphics:
    name: Parser and graphics fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "4"
      RUST_TEST_THREADS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Wayland title-bar text backend (crossfont) links FreeType and
      # Fontconfig through pkg-config on Linux.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libfontconfig1-dev libfreetype6-dev

      - name: Install pinned fuzz toolchain
        shell: bash
        run: |
          toolchain="$(.github/scripts/run-coverage-fuzz.sh --print-toolchain)"
          cargo_fuzz_version="$(.github/scripts/run-coverage-fuzz.sh --print-cargo-fuzz-version)"
          rustup toolchain install "$toolchain" --profile minimal
          cargo +"$toolchain" install cargo-fuzz --version "$cargo_fuzz_version" --locked
          cargo +"$toolchain" fuzz --version

      - name: Run bounded targets
        shell: bash
        run: .github/scripts/run-coverage-fuzz.sh
      - name: Upload retained fuzz evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-fuzz-parser-graphics
          path: |
            target/fuzz-evidence/parser-graphics/
            fuzz/parser_graphics/artifacts/
            fuzz/parser_graphics/corpus/
            fuzz/parser_graphics/corpus.toml
            fuzz/parser_graphics/Cargo.lock
          retention-days: 14
          if-no-files-found: warn
